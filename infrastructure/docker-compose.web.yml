# Web tier — runs on the public VM (searchforge-web).
#
#   cp .env.web.example .env.web   # fill in DOMAIN + secrets
#   docker compose -f docker-compose.web.yml --env-file .env.web up -d --build
#
# Only Caddy publishes ports (80/443). The frontend talks to the backend and
# Redis over the VCN private network (API_VM_IP / REDIS_URL in .env.web).

name: searchforge-web

services:
  frontend:
    build:
      context: ../frontend
    environment:
      NODE_ENV: production
      # Server-side only — browsers never see this URL or these credentials.
      SEARCH_API_URL: http://${API_VM_IP}:5000
      SEARCH_API_EMAIL: ${SEARCH_API_EMAIL:-}
      SEARCH_API_PASSWORD: ${SEARCH_API_PASSWORD:-}
      # Redis lives on the API VM; sessions persist across the private network.
      REDIS_URL: redis://:${REDIS_PASSWORD}@${API_VM_IP}:6379
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
